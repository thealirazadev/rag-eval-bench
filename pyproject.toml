[project]
name = "rag-eval-bench"
version = "0.1.0"
description = "Benchmark retrieval for RAG: compare chunking and BM25, dense, and hybrid retrievers with recall@k, MRR, and nDCG."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ali Raza" }]
dependencies = [
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.scripts]
ragbench = "ragbench.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
